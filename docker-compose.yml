# Local development environment.
# Start everything:  docker compose up -d
# Stop everything:   docker compose down        (data is kept)
# Wipe the database: docker compose down -v

services:
  # 1) Database: Microsoft SQL Server 2022 (Developer edition, free for dev/test).
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    # SQL Server images exist only for Intel/AMD (x86-64). On Apple Silicon Macs, Docker Desktop runs this
    # under emulation (Rosetta). Stating the platform makes that explicit and avoids "no matching manifest" errors.
    platform: linux/amd64
    container_name: attendance-clock-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      # Local-development password only. Override it by setting MSSQL_SA_PASSWORD in a .env file.
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-Dev_Passw0rd_2026!}"
    ports:
      - "1434:1433"   # so tools on Windows (SSMS, Azure Data Studio) can look inside
    volumes:
      - db-data:/var/opt/mssql   # keeps the data when the container restarts
    healthcheck:
      # "Healthy" only once SQL Server actually answers a query.
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # 2) Server: our ASP.NET Core API, run with "dotnet watch" so code changes reload automatically.
  api:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    container_name: attendance-clock-api
    restart: unless-stopped   # if it crashes, Docker starts it again
    working_dir: /src
    command: ["dotnet", "watch", "run", "--project", "AttendanceClock.Api", "--", "--urls", "http://0.0.0.0:5080"]
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__Default: "Server=db,1433;Database=AttendanceClock;User Id=sa;Password=${MSSQL_SA_PASSWORD:-Dev_Passw0rd_2026!};TrustServerCertificate=True"
      DOTNET_USE_POLLING_FILE_WATCHER: "1"     # file changes from Windows are detected by polling
      DOTNET_WATCH_RESTART_ON_RUDE_EDIT: "1"   # restart automatically instead of asking
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    ports:
      - "5081:5080"
    volumes:
      - ./backend:/src                                 # our code, shared live from Windows
      - api-bin:/src/AttendanceClock.Api/bin            # Linux build output stays inside Docker,
      - api-obj:/src/AttendanceClock.Api/obj            # separate from any Windows build files
      - tests-bin:/src/AttendanceClock.Tests/bin        # same for the test project
      - tests-obj:/src/AttendanceClock.Tests/obj
      - nuget-cache:/root/.nuget/packages               # downloaded libraries, reused between runs
    depends_on:
      db:
        condition: service_healthy

  # 3) Screens: the React app (Vite dev server). Open http://localhost:5175
  #    (not Vite's usual 5173, which other local projects often occupy)
  #    It forwards /api/* calls to the "api" container, so the browser talks to one address only.
  web:
    image: node:24-alpine
    container_name: attendance-clock-web
    working_dir: /app
    # Fail fast: the config file is named explicitly (missing → error, not silent defaults), and the vital settings
    # are repeated as flags, so even a restart can't come up on the wrong port. See docs/WORKING-WITH-CLAUDE.md (merge incident).
    command: ["sh", "-c", "npm install --no-audit --no-fund && npm run dev -- --config vite.config.ts --host 0.0.0.0 --port 5174 --strictPort"]
    restart: unless-stopped   # if it stops with an error, Docker starts it again
    healthcheck:
      # "Healthy" only if the app really answers on 5174; Docker Desktop shows "unhealthy" otherwise.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5174/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    environment:
      VITE_API_TARGET: "http://api:5080"
      CHOKIDAR_USEPOLLING: "1"   # file changes from Windows are detected by polling
    ports:
      - "5175:5174"
    volumes:
      - ./frontend:/app                       # our React code, shared live from Windows
      - web-node-modules:/app/node_modules    # downloaded packages stay inside Docker
    depends_on:
      - api

  # 4) Backend tests, on demand only:  docker compose run --rm tests
  #    Own build folders (volumes), so it never collides with the running API's "dotnet watch" build.
  #    Not started by "docker compose up" (profile "tests").
  tests:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    profiles: ["tests"]
    working_dir: /src
    command: ["dotnet", "test", "AttendanceClock.slnx"]
    environment:
      # Tests derive their own database name (AttendanceClock_Tests) from this server address.
      ConnectionStrings__Default: "Server=db,1433;Database=AttendanceClock;User Id=sa;Password=${MSSQL_SA_PASSWORD:-Dev_Passw0rd_2026!};TrustServerCertificate=True"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    volumes:
      - ./backend:/src
      - testrun-api-bin:/src/AttendanceClock.Api/bin
      - testrun-api-obj:/src/AttendanceClock.Api/obj
      - tests-bin:/src/AttendanceClock.Tests/bin
      - tests-obj:/src/AttendanceClock.Tests/obj
      - nuget-cache:/root/.nuget/packages
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
  api-bin:
  api-obj:
  tests-bin:
  tests-obj:
  testrun-api-bin:
  testrun-api-obj:
  nuget-cache:
  web-node-modules:
